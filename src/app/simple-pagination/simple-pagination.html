<div class="flex items-center justify-center gap-2">
    @for (index of totalPagesArray(); track index) {
    <div class="h-2 rounded-full transition-all duration-300 ease-in-out cursor-pointer"
        (click)="pageChange.emit(index)" [class.w-8]="activeIndex() === index"
        [class.bg-[#d13589]]="activeIndex() === index" [class.w-2]="activeIndex() !== index"
        [class.bg-gray-300]="activeIndex() !== index">
    </div>
    }
</div>
